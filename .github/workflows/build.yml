rootProject.name = "ScratchMod"
include ':app'

plugins {
    id 'com.android.application' version '8.5.2' apply false
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scratchmod.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.scratchmod.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

